<!DOCTYPE html>
<html lang="{{HTMLLANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 媒体请求不携带来源页信息，减少不必要的跨站信息暴露 -->
<meta name="referrer" content="no-referrer">
{{SHARE_HEAD}}
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E1013'/%3E%3Cg fill='none' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M32 15 V37 M22 30 l10 10 10-10' stroke='%2325F4EE' transform='translate(-2 0)'/%3E%3Cpath d='M32 15 V37 M22 30 l10 10 10-10' stroke='%23FE2C55' transform='translate(2 0)'/%3E%3Cpath d='M32 15 V37 M22 30 l10 10 10-10' stroke='%23fff'/%3E%3C/g%3E%3Cpath d='M20 46 h24' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* 分享页刻意做得比首页轻：无极光动画、无大量装饰，微信里首屏要 1 秒内出内容 */
:root{
  --bg:#0E1013; --surface:#16191E; --surface-2:#1C2026; --border:#272C34;
  --text:#EDEFF2; --muted:#8A93A0; --faint:#5B6470;
  --accent:#FE2C55; --accent-hover:#FF4D6F; --ok:#25F4EE;
  --radius:16px; --shadow:0 20px 50px -28px rgba(0,0,0,.7);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F2F4F7; --border:#E4E7EC;
    --text:#17191D; --muted:#6B7280; --faint:#9AA1AC;
    --accent:#E0234E; --accent-hover:#C71D44; --ok:#0FA8A0;
    --shadow:0 16px 40px -26px rgba(23,25,29,.28);
  }
}
*{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; line-height:1.65;
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
a{color:inherit; text-decoration:none}
img{max-width:100%; display:block}
.wrap{max-width:640px; margin:0 auto; padding:18px 14px 0}
:focus-visible{outline:2px solid var(--accent); outline-offset:4px}
.slogan{margin:4px 0 18px; color:var(--muted); font-size:14px; line-height:1.6}

/* ---------- 头 ---------- */
.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.brand{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted)}
.brand b{color:var(--text); font-weight:600}
.logo{width:24px; height:24px; border-radius:7px; background:var(--text);
  display:grid; place-items:center; color:var(--surface); font-size:12px; font-weight:700}
.top .mini{font-size:12.5px; color:var(--faint); border:1px solid var(--border);
  padding:5px 10px; border-radius:999px}

/* ---------- 卡片 ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; box-shadow:var(--shadow)}
/* 以真实媒体比例布局并居中；未知比例时先用竖屏占位，loadedmetadata 后立即修正。 */
.player{position:relative; width:min(100%,var(--player-width,39.375vh)); max-width:100%;
  margin-inline:auto; background:#000; aspect-ratio:var(--video-ratio,9/16);
  display:grid; place-items:center}
.player.wide{width:min(100%,var(--player-width,124.444vh)); max-width:100%;
  aspect-ratio:var(--video-ratio,16/9)}
.player video{width:100%; height:100%; object-fit:contain; background:#000}
.poster{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.82)}
.playbtn{position:absolute; inset:0; display:grid; place-items:center; z-index:2}
.playbtn i{width:66px; height:66px; border-radius:50%; background:rgba(255,255,255,.94);
  display:grid; place-items:center; box-shadow:0 8px 30px rgba(0,0,0,.45)}
.playbtn i::after{content:""; border-left:20px solid #14161a; border-top:12px solid transparent;
  border-bottom:12px solid transparent; margin-left:5px}
.loading{position:absolute; z-index:3; color:#fff; font-size:13px; background:rgba(0,0,0,.55);
  padding:7px 14px; border-radius:999px; display:none}
.media-pending{position:absolute; inset:0; z-index:2; display:grid; place-items:center;
  align-content:center; gap:10px; padding:24px; text-align:center; color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.68))}
.media-pending .spinner{width:28px; height:28px; border:3px solid rgba(255,255,255,.35);
  border-top-color:#fff; border-radius:50%; animation:spin .85s linear infinite}
.media-pending p{font-size:13px; line-height:1.6; text-shadow:0 1px 4px rgba(0,0,0,.5)}
.media-pending button{border:1px solid rgba(255,255,255,.55); border-radius:999px;
  padding:6px 14px; color:#fff; background:rgba(0,0,0,.3); font-size:12px}
.btn:disabled{opacity:.48; cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.media-pending .spinner{animation:none}}

.body{padding:20px}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ok);
  background:color-mix(in srgb, var(--ok) 12%, transparent); border-radius:999px;
  padding:4px 10px; margin-bottom:9px}
.title{font-size:18px; font-weight:650; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere}
.author{display:flex; align-items:center; gap:10px; margin-top:13px; padding-top:13px; border-top:1px solid var(--border)}
.author img,.author .ph{width:40px; height:40px; border-radius:50%; object-fit:cover; background:var(--surface-2); flex:0 0 auto}
.author .n{font-weight:600; font-size:14.5px}
.author .identity{min-width:0; overflow-wrap:anywhere}
.author .s{font-size:12px; color:var(--faint)}
.author .go{margin-left:auto; font-size:12.5px; color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  padding:5px 11px; border-radius:999px; white-space:nowrap}
.extra{margin-top:11px; font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:5px}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.tag{font-size:11.5px; color:var(--muted); background:var(--surface-2); padding:3px 9px; border-radius:999px}
.tag,.extra{overflow-wrap:anywhere}
.engagement{--columns:4; display:grid; grid-template-columns:repeat(var(--columns),minmax(0,1fr));
  gap:1px; margin-top:18px; background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden}
.engagement[data-count="1"]{--columns:1}.engagement[data-count="2"]{--columns:2}.engagement[data-count="3"]{--columns:3}
.engagement>div{display:flex; flex-direction:column; gap:2px; padding:12px 16px; background:var(--surface-2)}
.engagement dt{font-size:12px; color:var(--muted)}
.engagement dd{order:-1; font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; line-height:1.4}
.metadata{display:flex; flex-wrap:wrap; gap:14px 24px; margin-top:18px; padding:14px 0; border-block:1px solid var(--border)}
.metadata dt,.profile-data dt{font-size:12px; color:var(--muted)}
.metadata dd{font-size:13px; font-weight:550; font-variant-numeric:tabular-nums}
.metadata+.author{padding-top:0; border-top:0}
.profile{margin-top:12px; font-size:13px; border-bottom:1px solid var(--border); padding-bottom:12px}
.profile summary{cursor:pointer; color:var(--muted); width:fit-content}
.profile-data{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 20px; margin-top:12px}
.profile-data dd{overflow-wrap:anywhere; font-variant-numeric:tabular-nums}
.signature{white-space:pre-wrap; overflow-wrap:anywhere; margin-top:12px}
.snapshot-note{font-size:11.5px; color:var(--muted); margin-top:14px}
.caption-tools{display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; font-size:13px}
.caption-tools button,.caption-tools a{color:var(--accent); min-height:32px; display:inline-flex; align-items:center}
.caption-tools .original-work{min-height:44px; padding:10px 16px; border:1px solid var(--border); border-radius:12px; color:var(--text); font-weight:600; text-decoration:none}
.original-work:hover{background:var(--bg)}
.original-work:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
@media(max-width:480px){
  .body{padding:16px}
  .engagement[data-count="3"],.engagement[data-count="4"]{--columns:2}
  .engagement[data-count="3"]>div:last-child{grid-column:1/-1}
  .engagement>div{padding:10px 12px}.engagement dd{font-size:20px}
  .top{gap:10px}.brand{font-size:12.5px}.top .mini{white-space:nowrap}
}

/* ---------- 图集 ---------- */
.album{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; padding:6px}
.album figure{position:relative; border-radius:10px; overflow:hidden; background:var(--surface-2)}
.album img{width:100%; aspect-ratio:3/4; object-fit:cover}
.album .idx{position:absolute; top:6px; left:6px; font-size:11px; background:rgba(0,0,0,.6);
  color:#fff; padding:2px 7px; border-radius:999px}
.album .save{position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.62); color:#fff;
  font-size:11.5px; padding:5px 10px; border-radius:999px}

/* ---------- 底部操作条 ---------- */
.bar{position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; gap:9px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px);
  border-top:1px solid var(--border)}
.bar .in{max-width:612px; margin:0 auto; display:flex; gap:9px; width:100%}
.btn{flex:1; border-radius:13px; padding:13px 10px; font-size:15px; font-weight:600; text-align:center}
.btn.p{background:var(--accent); color:#fff}
.btn.p:active{background:var(--accent-hover)}
.btn.g{background:var(--surface-2); border:1px solid var(--border); flex:0 0 auto; padding:13px 17px}

/* ---------- CTA / 页脚 ---------- */
.cta{margin-top:13px; background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 13%,var(--surface)), var(--surface));
  border:1px solid color-mix(in srgb,var(--accent) 24%,var(--border)); border-radius:var(--radius);
  padding:15px; display:flex; align-items:center; gap:12px}
.cta .t{font-size:14.5px; font-weight:600}
.cta .d{font-size:12.5px; color:var(--muted); margin-top:2px}
.cta .arrow{margin-left:auto; color:var(--accent); font-size:20px}
.poster-cta{width:100%; margin-top:11px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:13px; font-size:14.5px; font-weight:600; text-align:center}
.poster-cta span{display:block; font-size:12px; font-weight:400; color:var(--muted); margin-top:2px}
.trust{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; justify-content:center}
.trust span{font-size:11.5px; color:var(--faint); background:var(--surface); border:1px solid var(--border);
  padding:4px 10px; border-radius:999px}
footer{margin-top:16px; padding:16px 4px 26px; text-align:center; font-size:11.5px; color:var(--faint); line-height:1.9}
footer a{color:var(--muted); text-decoration:underline; text-underline-offset:2px}

/* ---------- 微信引导蒙层 ---------- */
.mask{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.86); display:none;
  padding:18px; color:#fff; animation:fade .18s ease}
.mask.show{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mask .arrow{position:absolute; top:8px; right:14px; font-size:44px; animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.mask .m-in{position:absolute; top:96px; left:50%; transform:translateX(-50%); width:min(360px,90%); text-align:center}
.mask h3{font-size:19px; margin-bottom:10px}
.mask p{font-size:14px; color:#c9cfd8; line-height:1.8}
.mask .step{background:rgba(255,255,255,.1); border-radius:12px; padding:12px; margin-top:14px; font-size:13.5px; text-align:left}
.mask .close{margin-top:18px; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:9px 22px; font-size:14px}
.mask .copy{margin-top:10px; background:#fff; color:#111; border-radius:999px; padding:10px 22px; font-size:14px; font-weight:600}

/* ---------- 海报 ---------- */
.pmask{position:fixed; inset:0; z-index:96; background:rgba(0,0,0,.9); display:none;
  overflow:auto; padding:22px 16px; text-align:center}
.pmask.show{display:block}
.pmask img{width:min(330px,86vw); border-radius:14px; margin:0 auto; box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pmask .p-tip{color:#dfe4ea; font-size:13px; margin-top:14px; line-height:1.8}
.pmask .p-act{margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.pmask .p-act button,.pmask .p-act a{border:1px solid rgba(255,255,255,.32); color:#fff;
  border-radius:999px; padding:9px 20px; font-size:14px}
.pmask .p-act .prim{background:#fff; color:#111; border-color:#fff; font-weight:600}
.pload{position:fixed; inset:0; z-index:97; display:none; place-items:center;
  background:rgba(0,0,0,.6); color:#fff; font-size:14px}
.pload.show{display:grid}

/* ---------- 状态页 ---------- */
.state{max-width:420px; margin:16vh auto 0; text-align:center; padding:0 22px}
.state .ico{font-size:44px}
.state .ico.wait{width:42px; height:42px; margin:0 auto; border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--accent); animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.state .ico.wait{animation:none}}
.state h2{font-size:19px; margin:14px 0 8px}
.state p{color:var(--muted); font-size:14px}
.state .wait-note{margin-top:12px; font-size:12.5px; color:var(--faint)}
.state .home{display:inline-block; margin-top:20px; background:var(--accent); color:#fff;
  padding:11px 24px; border-radius:12px; font-size:14.5px; font-weight:600}

/* ---------- 提示条 ---------- */
.toast{position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px); z-index:95;
  background:rgba(20,22,26,.95); color:#fff; font-size:13px; padding:9px 18px; border-radius:999px;
  opacity:0; pointer-events:none; transition:.22s}
.toast.show{opacity:1; transform:translate(-50%,0)}
.qr{display:none; margin-top:13px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:15px; text-align:center}
.qr img{width:132px; margin:0 auto 8px; border-radius:8px}
.qr div{font-size:12px; color:var(--muted)}
@media (min-width:760px){ .qr{display:block} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<div class="pload" id="pload" data-ui="正在生成海报…">正在生成海报…</div>
<div class="pmask" id="pmask">
  <img id="posterImg" alt="分享海报">
  <div class="p-tip" id="posterTip" data-ui="长按图片保存到相册 · 或直接转发给朋友">长按图片保存到相册 · 或直接转发给朋友</div>
  <div class="p-act">
    <a class="prim" id="posterDl" download="douyin-share.png" style="display:none" data-ui="下载海报">下载海报</a>
    <button onclick="hidePoster()" data-ui="关闭">关闭</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="arrow">↗</div>
  <div class="m-in">
    <h3 id="maskTitle">下载需在浏览器中打开</h3>
    <p id="maskDesc">视频可以直接在微信内播放；如需保存文件，<br>请按下面两步操作 👇</p>
    <div class="step" id="maskStep">
      ① 点击右上角的 <b>···</b> 按钮<br>
      ② 选择 <b>「在浏览器中打开」</b><br>
      ③ 在浏览器里点下载即可保存原片
    </div>
    <button class="copy" id="maskCopy" onclick="copyLink()" data-ui="复制本页链接">复制本页链接</button><br>
    <button class="close" onclick="hideMask()" data-ui="我知道了">我知道了</button>
  </div>
</div>

<script>
const S = window.__SHARE = {{SHARE_DATA}};
const IS_WECHAT_UA = {{WECHAT}} || /micromessenger/i.test(navigator.userAgent);
const ORIGIN = "{{ORIGIN}}";
const LANG = '{{LANG}}';
const app = document.getElementById('app');
function sharePlatform(){ return S.data?.platform === 'tiktok' ? 'TikTok' : (LANG === 'en' ? 'Douyin' : '抖音'); }
function switchLanguage(){
  const url = new URL(location.href);
  url.searchParams.set('lang', LANG === 'en' ? 'zh' : 'en');
  location.href = url.href;
}
localizeUi();

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function copyText(text){
  const value = String(text ?? '');
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
    try { await navigator.clipboard.writeText(value); return true; } catch {}
  }
  const area = document.createElement('textarea');
  area.value = value; area.setAttribute('readonly','');
  area.style.position = 'fixed'; area.style.opacity = '0';
  document.body.appendChild(area); area.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  area.remove(); return ok;
}
const fmtDate = (ts) => { if(!ts) return ''; const d = new Date(ts*1000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtTimestamp = (ts) => {
  if (!Number.isFinite(Number(ts)) || Number(ts) <= 0) return '';
  const date = new Date(Number(ts) * 1000);
  return Number.isNaN(date.getTime()) ? '' : fmtDate(ts) + ' ' + String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
};

function mediaDimensions(video){
  const width = Math.round(Number(video?.videoWidth || video?.width
    || video?.dataset?.videoWidth) || 0);
  const height = Math.round(Number(video?.videoHeight || video?.height
    || video?.dataset?.videoHeight) || 0);
  return width > 0 && height > 0 ? {width, height} : null;
}
function playerInlineStyle(video){
  const dims = mediaDimensions(video);
  if (!dims) return '';
  const ratio = dims.width / dims.height;
  // 使用 CSS 视口单位，后台标签初始尺寸为 0 或窗口调整后也会自动适配。
  return `--video-ratio:${dims.width} / ${dims.height};--player-width:${ratio * 70}vh`;
}
/* 埋点：sendBeacon 不阻塞页面。extra 用于播放诊断（source/stage/detail/ms） */
function track(kind, extra){
  try {
    const b = JSON.stringify(Object.assign({kind}, extra || {}));
    if (navigator.sendBeacon) navigator.sendBeacon('/api/share/' + S.sid + '/event',
      new Blob([b], {type:'application/json'}));
    else fetch('/api/share/' + S.sid + '/event', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:b, keepalive:true});
  } catch {}
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = uiText(msg); t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1900);
}
const _MASK_DEFAULT = {
  title: uiText('下载需在浏览器中打开'),
  desc: uiText('视频可以直接在微信内播放；如需保存文件，<br>请按下面两步操作 👇'),
  step: uiText('① 点击右上角的 <b>···</b> 按钮<br>② 选择 <b>「在浏览器中打开」</b><br>③ 在浏览器里点下载即可保存原片'),
};
/* copy=false 时隐藏「复制本页链接」按钮。用在「发送给好友」引导里：
   微信不会把粘贴的网址展开成卡片，复制粘贴出去必然是一条纯文字链，
   把这个按钮摆在引导旁边等于劝用户走错路。 */
function showMask(title, desc, step, copy){
  document.getElementById('maskTitle').textContent = uiText(title || _MASK_DEFAULT.title);
  document.getElementById('maskDesc').innerHTML = uiText(desc || _MASK_DEFAULT.desc);
  document.getElementById('maskStep').innerHTML = uiText(step || _MASK_DEFAULT.step);
  document.getElementById('maskCopy').style.display = (copy === false) ? 'none' : '';
  document.getElementById('mask').classList.add('show');
}
function hideMask(){ document.getElementById('mask').classList.remove('show'); }
/* 抖音风格分享文案：标题 + 一句引导 + 链接（两行以内，标题过长截断） */
function shareText(){
  const url = S.url || location.href;
  const t = String(S.title || sharePlatform() + ' video').replace(/\s+/g, ' ').trim();
  const short = t.length > 40 ? t.slice(0, 40) + '…' : t;
  const by = S.author ? `@${S.author} · ${sharePlatform()}` : sharePlatform();
  return `【${short}】${by}\n${uiText('点开直接看，无需安装 App')} 👉 ${url}`;
}
function copyLink(){
  const text = shareText();

/* ---------------- 状态页 ---------------- */
const STATES = {
  notfound: ['🔍',uiText('分享页不存在'),uiText('链接可能有误，或已被创建者删除。')],
  pending:  ['',uiText('视频正在准备中'),uiText('链接已创建，系统正在后台获取内容。')],
  processing:['',uiText('正在获取视频内容'),uiText('通常只需几秒，完成后本页会自动更新。')],
  failed:   ['⚠️',uiText('内容获取失败'),uiText('抖音内容暂时无法获取，请稍后重新生成。')],
  expired:  ['⏳',uiText('分享链接已过期'),uiText('为保护创作者权益，分享页有有效期。可以让分享者重新生成一个。')],
  dead:     ['🗑',uiText('内容已不可用'),uiText('该作品可能已被原作者删除，或设置为私密/仅粉丝可见。')],
  takedown: ['🛡',uiText('内容已下架'),uiText('该分享页因权利人投诉或违规已被下架处理。')],
};
function renderState(state){
  const [ico, h, fallback] = STATES[state] || STATES.notfound;
  const waiting = state === 'pending' || state === 'processing';
  const p = (state === 'failed' && S.error && S.error.message)
    ? S.error.message : (waiting && _statusNotice ? _statusNotice : fallback);
  document.body.style.paddingBottom = '0';
  app.innerHTML = `<div class="state" role="status" aria-live="polite">
    <div class="ico${waiting ? ' wait' : ''}" aria-hidden="true">${ico}</div><h2>${uiText(h)}</h2><p>${esc(uiText(p))}</p>
    ${waiting ? '<p class="wait-note" data-ui="页面可以继续打开；准备完成前请先不要转发到微信，避免卡片缓存为“准备中”。">页面可以继续打开；准备完成前请先不要转发到微信，避免卡片缓存为“准备中”。</p>' : ''}
    ${S.author ? `<p style="margin-top:10px;font-size:12.5px;color:var(--faint)">原作者：@${esc(S.author)}</p>` : ''}
    ${waiting ? '' : '<a class="home" href="/" data-ui="去重新生成分享页 →">去重新生成分享页 →</a>'}
  </div>`;
}

let _statusTimer = null;
let _statusFailures = 0;
let _statusPollRound = 0;
let _statusNotice = '';
const STATUS_POLL_STEPS = [1200, 2000, 3000, 5000, 8000, 10000];
function nextStatusPollDelay(serverMs, failureCount){
  const extra = Math.max(0, Number(failureCount) || 0);
  const idx = Math.min(STATUS_POLL_STEPS.length - 1, _statusPollRound + extra);
  const localMs = STATUS_POLL_STEPS[idx];
  const advisedMs = Number(serverMs);
  const combined = Number.isFinite(advisedMs) && advisedMs > 0
    ? Math.max(localMs, advisedMs) : localMs;
  return Math.max(800, Math.min(10000, combined));
}
function scheduleStatusPoll(ms){
  clearTimeout(_statusTimer);
  _statusTimer = null;
  if (document.hidden) return;
  _statusTimer = setTimeout(() => {
    _statusTimer = null;
    pollShareStatus();
  }, Math.max(800, Math.min(10000, ms || 1500)));
}
async function pollShareStatus(){
  if (!S.sid) return;
  if (document.hidden) return;
  try {
    const resp = await fetch('/api/shares/' + encodeURIComponent(S.sid), {
      credentials:'same-origin', cache:'no-store', headers:{'Accept':'application/json'},
    });
    if (resp.status === 404 || resp.status === 410){
      clearTimeout(_statusTimer); _statusTimer = null;
      S.state = resp.status === 410 ? 'expired' : 'notfound';
      S.error = null; _statusNotice = '';
      renderState(S.state);
      return;
    }
    if (!resp.ok) throw new Error('status_' + resp.status);
    const result = await resp.json();
    const d = result && result.data;
    if (!d || !d.status) throw new Error('invalid_status');
    const hadNotice = !!_statusNotice;
    _statusFailures = 0;
    _statusNotice = '';
    if (d.status === 'ready'){
      clearTimeout(_statusTimer); _statusTimer = null;
      location.reload();
      return;
    }
    if (!['pending','processing'].includes(d.status)){
      clearTimeout(_statusTimer); _statusTimer = null;
      S.state = d.status;
      S.error = d.error || null;
      renderState(S.state);
      return;
    }
    if (S.state !== d.status || hadNotice){ S.state = d.status; renderState(S.state); }
    _statusPollRound += 1;
    scheduleStatusPoll(nextStatusPollDelay(d.poll_after_ms, 0));
  } catch {
    _statusFailures += 1;
    if (_statusFailures >= 3 && !_statusNotice){
      _statusNotice = '网络暂时不稳定，后台仍在继续处理。恢复连接后本页会自动更新。';
      renderState(S.state);
    }
    scheduleStatusPoll(nextStatusPollDelay(0, _statusFailures));
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ clearTimeout(_statusTimer); _statusTimer = null; return; }
  if (S.state === 'pending' || S.state === 'processing') scheduleStatusPoll(100);

});

function retryMedia(){
  if (S.state === 'ok') { prepareShareMedia(true); return; }
  _statusNotice = '';
  _statusFailures = 0;
  pollShareStatus();
}

function countValue(value){
  if (typeof value !== 'number' && !(typeof value === 'string' && /^\d+$/.test(value.trim()))) return null;

  return Number.isSafeInteger(number) && number >= 0 ? number : null;

/* ---------------- 播放：媒体直连 → 同源流 ----------------
   新解析使用统一媒体地址，直连失败后转受签名保护的同源流。
   微信 WebView 拦截直连域名时常不报 error 只挂起，因此仍用短看门狗及时切线。
   每条线路的 try/ok/fail 都上报后台「播放诊断」，用来回答「微信里哪些视频能播」。 */
let _playSession = 0;
// Keep the playback state machine self-contained: the same block is exercised
// by the lightweight browser regression harness as well as the full page.
// 同一页面的预检、播放和重复点击共用刷新请求；失败后短暂冷却。
const _playbackRefreshes = new WeakMap();
function refreshVideoForPlayback(video, failedUrl){
  const old = _playbackRefreshes.get(video);
  if (old && (old.pending || Date.now() - old.at < 30000)) return old.promise;
  const state = {pending: true, at: Date.now()};
  state.promise = refreshVideoDownloadLink(video, failedUrl).finally(() => {
    state.pending = false; state.at = Date.now();
  });
  _playbackRefreshes.set(video, state);
  return state.promise;
}

function syncPlayerRatio(video){
  const width = Math.round(Number(video?.videoWidth || video?.width
    || video?.dataset?.videoWidth) || 0);
  const height = Math.round(Number(video?.videoHeight || video?.height
    || video?.dataset?.videoHeight) || 0);
  const box = document.getElementById('playerBox');
  if (!(width > 0 && height > 0) || !box || !box.style?.setProperty) return;
  const ratio = `${width} / ${height}`;
  box.style.setProperty('--video-ratio', ratio);
  box.style.setProperty('--player-width', `${width / height * 70}vh`);
  box.classList.toggle('wide', width / height > 1.05);
}
function syncPlayerMetadata(video){
  syncPlayerRatio(video);
  const target = document.getElementById('mediaMetadata');
  if (!target) return;
  const width = Number(video?.videoWidth);
  const height = Number(video?.videoHeight);
  const duration = Number(video?.duration);
  const hasDimensions = Number.isFinite(width) && Number.isFinite(height) && width > 0 && height > 0;
  const hasDuration = Number.isFinite(duration) && duration > 0;
  if (!hasDimensions && !hasDuration) return;
  // 线路可能返回不同清晰度；展示当前文件参数，不改后台作品信息快照。
  const data = {...S.data, video: {...S.data?.video}};
  if (hasDimensions) Object.assign(data.video, {width: Math.round(width), height: Math.round(height)});
  if (hasDuration) data.duration_ms = Math.round(duration * 1000);
  target.innerHTML = metadataBlock(data);
}
// 打开时只加载媒体元数据；有效地址不重新解析，缺失/失效才请求后台续期。
let _mediaProbe = 0;
let _mediaPreparing = null;
function prepareShareMedia(force = false){
  if (S.state !== 'ok' || S.kind === 'note' || !S.data?.video?.download_refresh_url) return;
  if (_mediaPreparing) return _mediaPreparing;
  const video = S.data.video;
  const primary = ['parser','atc'].includes(video.source || S.data.source);
  const src = video.direct_url || video.atc_url || video.url || (!primary && video.proxy_url);
  const probeId = ++_mediaProbe;
  _mediaPreparing = (async () => {
    const valid = src && !force && await new Promise(resolve => {
      const probe = document.createElement('video');
      let done = false;
      const finish = ok => {
        if (done) return;
        done = true; clearTimeout(timer);
        probe.removeAttribute('src'); probe.load(); resolve(ok);
      };
      const timer = setTimeout(() => finish(false), 12000);
      probe.preload = 'metadata'; probe.muted = true;
      probe.addEventListener('loadedmetadata', () => finish(true), {once:true});
      probe.addEventListener('error', () => finish(false), {once:true});
      probe.src = src; probe.load();
    });
    if (valid || probeId !== _mediaProbe || S.state !== 'ok') return;
    const loading = document.getElementById('loading');
    if (loading && !document.getElementById('player')) {
      loading.textContent = uiText('正在更新视频地址…'); loading.style.display = 'block';
    }
    try { await refreshVideoForPlayback(video, video.direct_url || video.atc_url || video.url || ''); }
    catch { if (!document.getElementById('player')) toast(uiText('视频地址更新失败，请点击播放重试')); }
    finally { if (loading && !document.getElementById('player')) loading.style.display = 'none'; }
  })().finally(() => { _mediaPreparing = null; });
  return _mediaPreparing;
}
function startPlay(){
  const d = S.data || {};
  if (d.video?.download_refresh_url && !(d.video.url || d.video.atc_url || d.video.proxy_url)) {
    prepareShareMedia().then(() => {
      if (d.video.url || d.video.atc_url || d.video.proxy_url) startPlay();
    });
    return;
  }
  if (!d.video || !(d.video.url || d.video.atc_url || d.video.proxy_url)){
    toast(uiText('视频正在准备中，请稍候'));
    retryMedia();
    return;
  }
  const box = document.getElementById('playerBox');
  const btn = document.getElementById('playBtn');
  const ld = document.getElementById('loading');
  const existing = document.getElementById('player');
  if (existing){
    const retryPromise = existing.play?.();
    retryPromise?.catch(()=>{});
    return;
  }
  const session = ++_playSession;
  btn.style.display = 'none'; ld.style.display = 'block';
  track('play');

  // 播放线路按后台配置的优先级动态构建。
  const directWait = IS_WECHAT_UA ? 4000 : 7000;
  const source = String(d.video.source || '').toLowerCase();
  const fromUnified = source === 'parser' || source === 'atc';
  const fromDouyinDirect = source === 'douyin_direct' || source === 'douyin_web';
  const ROUTES = {
    atc:   {src: d.video.atc_url || (fromUnified ? (d.video.direct_url || d.video.url) : ''), wait: directWait, tip: uiText('加载中…')},
    proxy: {src: d.video.proxy_url, wait: 12000,      tip: '切换备用线路中…'},
    dy1:   {src: fromUnified ? '' : d.video.url,     wait: directWait, tip: fromDouyinDirect ? '切换官方直连中…' : '切换旧直连中…'},
    dy2:   {src: fromUnified ? '' : d.video.alt_url, wait: directWait, tip: fromDouyinDirect ? '切换官方备用线路中…' : '切换旧备线中…'},
  };
  const priority = (Array.isArray(d.play_priority) && d.play_priority.length)
    ? d.play_priority
    : (fromUnified ? ['atc','proxy','dy1','dy2']
       : (fromDouyinDirect ? ['proxy','dy1','dy2'] : ['dy1','dy2','atc','proxy']));
  const seen = new Set();
  const routes = priority
    .filter(k => ROUTES[k])
    .map(k => ({source: k, ...ROUTES[k]}))
    .filter(r => r.src && !seen.has(r.src) && seen.add(r.src));

  const v = document.createElement('video');
  v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
  v.setAttribute('x5-playsinline',''); v.setAttribute('x5-video-player-type','h5');
  v.setAttribute('x5-video-player-fullscreen','false');
  v.controls = true; v.preload = 'auto'; v.autoplay = true;
  if (S.cover) v.poster = S.cover;
  if (v.dataset){
    v.dataset.videoWidth = d.video.width || '';
    v.dataset.videoHeight = d.video.height || '';
  }
  v.addEventListener('loadedmetadata', () => syncPlayerMetadata(v));
  v.addEventListener('durationchange', () => syncPlayerMetadata(v));
  v.id = 'player';
  box.appendChild(v);
  syncPlayerRatio(v);
  const poster = document.getElementById('poster'); if (poster) poster.style.display = 'none';

  let idx = -1, t0 = 0, timer = 0, settled = false, hs = null, attempt = 0, refreshed = false;
  const successEvents = ['loadeddata', 'canplay', 'playing', 'timeupdate'];
  const isCurrent = () =>
    session === _playSession && document.getElementById('player') === v;
  const isActuallyPlaying = () =>
    v.currentTime > 0 || (!v.paused && v.readyState >= 2);

  // 每条线路挂自己的一套监听并在切走时摘掉：否则上一条线路迟到的 error
  // 会把下一条线路一起判死，出现「只试了一条就放弃」。
  function unbind(){
    if (!hs) return;
    successEvents.forEach(name => v.removeEventListener(name, hs.ok));
    if (hs.err) v.removeEventListener('error', hs.err);
    hs = null;
  }
  function stop(){ clearTimeout(timer); unbind(); }

  const onOK = (myAttempt) => {
    if (!isCurrent() || settled || myAttempt !== attempt) return;
    settled = true; stop(); ld.style.display = 'none';
    track('play_ok', {source:routes[idx].source, stage:'ok', ms:Date.now()-t0});
  };
  const onErr = (stage, myAttempt) => {
    if (!isCurrent() || settled || myAttempt !== attempt) return;
    // 微信/X5 偶尔会在视频已经起播后补发 error，不能因此切线或弹失败遮罩。
    if (isActuallyPlaying()){ onOK(myAttempt); return; }
    const e = v.error;
    const detail = (e ? 'code=' + e.code : 'no-error') + ' rs=' + v.readyState + ' ns=' + v.networkState;
    // 上报失败后链上下一条将重试的线路（无则空 = 下一条是放弃），供后台播放日志诊断
    track('play_fail', {source:routes[idx].source, stage, detail, ms:Date.now()-t0,
                        next:(routes[idx+1] || {}).source || ''});
    next();
  };

  function next(){
    stop();
    if (!isCurrent() || settled) return;
    // 主线路失败时先续期一次，再尝试原有备用线路；无有效地址同样可恢复。
    if (!refreshed && d.video.download_refresh_url &&
        (idx >= 0 && routes[idx].source === 'atc' || idx + 1 >= routes.length)) {
      refreshed = true;
      ld.textContent = uiText('正在更新视频地址…');
      refreshVideoForPlayback(d.video, d.video.direct_url || d.video.atc_url || d.video.url || '')
        .then(url => {
          if (!isCurrent() || settled) return;
          routes.splice(idx + 1, 0, {source:'atc', src:url, wait:directWait, tip:uiText('加载中…')});
          next();
        }).catch(() => { if (isCurrent() && !settled) next(); });
      return;
    }
    if (idx + 1 >= routes.length){ giveUp(); return; }
    idx++;
    const myAttempt = ++attempt;
    const r = routes[idx];
    track('play_try', {source:r.source, stage:'start'});    // 全量尝试日志（后台「播放尝试日志」）
    if (idx > 0) track('fallback', {source:r.source, stage:'start'});
    ld.textContent = r.tip;
    t0 = Date.now();
    hs = {ok: () => onOK(myAttempt),
          err: () => onErr('error', myAttempt)};
    successEvents.forEach(name => v.addEventListener(name, hs.ok));
    v.addEventListener('error', hs.err);
    v.src = r.src; v.load();
    const playPromise = v.play?.();
    if (playPromise?.then){
      // play() Promise 只表示请求被接受，不等于已经开始出帧；最终成功
      // 仍由 playing/timeupdate/readyState 看门狗确认，避免过早停止切线。
      playPromise.then(() => {
        if (isActuallyPlaying()) onOK(myAttempt);
      }).catch(()=>{ /* controls 仍可手动播放 */ });
    }
    // 直连在部分网络/内核下不会报 error，只是一直不 ready —— 用看门狗兜底
    timer = setTimeout(() => {
      if (!isCurrent() || settled || myAttempt !== attempt) return;
      if (isActuallyPlaying()) onOK(myAttempt);
      else onErr('timeout', myAttempt);
    }, r.wait);
  }
  function giveUp(){
    if (!isCurrent() || settled) return;
    const myAttempt = attempt;
    // X5 的 playing/timeupdate 有时比 error/timeout 晚到，留一个很短的确认窗口。
    hs = {ok: () => onOK(myAttempt), err: null};
    successEvents.forEach(name => v.addEventListener(name, hs.ok));
    timer = setTimeout(() => {
      if (!isCurrent() || settled || myAttempt !== attempt) return;
      if (isActuallyPlaying()){ onOK(myAttempt); return; }
      settled = true; stop(); ld.style.display = 'none';
      v.remove(); btn.style.display = '';
      if (poster) poster.style.display = '';
      track('play_fail', {source:'', stage:'giveup',
        detail:'all ' + routes.length + ' routes failed'});
      // 自动探测失败不能弹阻断遮罩：微信/X5 可能已经在原生视频层播放，
      // 但没有及时同步标准事件。浏览器引导只保留给用户明确点击下载/分享。
      if (IS_WECHAT_UA) toast(uiText('若画面已播放可继续观看；仍无画面时请点视频播放键重试'));
      else toast(uiText('播放失败，请稍后重试或直接下载'));
    }, 600);
  }

  next();
}

let _shareDownloading = false;
async function refreshShareDownloadData(){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  let resp, current;
  try {
    resp = await fetch('/api/share/' + encodeURIComponent(S.sid), {
      credentials:'same-origin', cache:'no-store', signal:controller.signal,
      headers:{'Accept':'application/json'},
    });
    current = await resp.json();
  } catch {
    throw new Error(uiText('暂时无法检查分享内容，请稍后重试'));
  } finally { clearTimeout(timer); }
  if (!current || typeof current !== 'object')
    throw new Error(uiText('暂时无法检查分享内容，请稍后重试'));
  if (resp.status === 404 || current.state === 'notfound')
    throw new Error(uiText('分享页不存在或已删除，请重新生成分享页'));
  if (current.state === 'expired') throw new Error(uiText('分享链接已过期，请重新生成分享页'));
  if (!resp.ok || current.state !== 'ok')
    throw new Error(uiText('分享内容暂不可下载，请稍后重试'));
  if (current.item_id !== S.item_id || current.kind !== 'video' || !current.data?.video)
    throw new Error(uiText('分享内容已变化，请刷新页面后再试'));
  // 只重读后台快照并取得新签名；保留页面标题、互动数与当前播放位置。
  const video = S.data.video || (S.data.video = {});
  for (const key of ['url','direct_url','atc_url','alt_url','proxy_url','download_url','download_refresh_url'])
    delete video[key];
  Object.assign(video, current.data.video);
  S.data.source = current.data.source;
  return S.data;
}
async function download(btn){
  if (_shareDownloading || btn?.disabled) return false;
  if (IS_WECHAT_UA){ showMask(); return false; }
  _shareDownloading = true;
  const oldHTML = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.textContent = uiText('检查下载线路…'); }
  try {
    const d = await refreshShareDownloadData();
    if (!(videoDownloadRefreshURL(d.video) || videoDirectDownloadURL(d.video,d.source)
          || d.video.download_url || d.video.proxy_url))
      throw new Error(uiText('视频正在准备中，请稍候'));
    track('download');
    return await browserDownload(d.video.url, d.video.filename || (S.title.slice(0,40) + '.mp4'),
      btn, d.video.download_url || d.video.proxy_url, true, videoDirectDownloadURL(d.video,d.source), d.video);
  } catch(error) {
    toast(error.message || uiText('下载失败，请稍后重试'));
    return false;
  } finally {
    _shareDownloading = false;
    if (btn) { btn.innerHTML = oldHTML; btn.disabled = false; }
  }
}

function shareImageDownloadSrc(image){

function downloadTarget(onError){
  const id = 'nativeDownloadTarget';
  let frame = document.getElementById(id);
  if (!frame){
    frame = document.createElement('iframe');
    frame.id = id;
    frame.name = id;
    frame.hidden = true;
    frame.setAttribute('aria-hidden', 'true');
    document.body.appendChild(frame);
  }
  frame.onload = () => {
    try {
      const href = frame.contentWindow?.location?.href || '';
      if (!href.includes('/api/video/') && !href.includes('/api/atc/video/') && !href.includes('/api/media/video/')
          && !href.includes('/api/douyin/video/')) return;
      const text = (frame.contentDocument?.body?.textContent || '').trim();
      let message = '';
      try { message = JSON.parse(text).error || ''; } catch {}
      onError?.(message || uiText('下载未能启动，请稍后重试'));
    } catch {}
  };
  return frame.name;
}
function clickDownload(url, filename, isolated=false, onError=null){
  const a = document.createElement('a');
  a.href = url;
  if (isolated) a.target = downloadTarget(onError);
  else a.download = filename || 'download';
  a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
}
function videoDirectDownloadURL(video, source=''){
  if (!video) return '';
  const urls=[video.atc_url];
  if (['parser','atc'].includes(video.source || source)) urls.push(video.direct_url,video.url);
  for (const raw of urls){
    if (!raw || typeof raw!=='string') continue;
    try {
      const u=new URL(raw);
      if (u.protocol==='https:' && !u.username && !u.password && (!u.port || u.port==='443')) return raw;
    } catch {}
  }
  return '';
}

function videoDownloadRefreshURL(video){
  try {
    const u = new URL(video?.download_refresh_url || '', location.href);
    if (u.origin === location.origin && /^\/api\/media\/video\/[\w-]{8,40}\/download-link$/.test(u.pathname))
      return u.pathname + u.search;
  } catch {}
  return '';
}

async function refreshVideoDownloadLink(video, failedUrl){
  let endpoint = videoDownloadRefreshURL(video);
  if (!endpoint) throw new Error(uiText('暂时无法更新下载链接，请稍后重试'));
  const deadline = Date.now() + 310000;
  for (let attempt = 0; attempt < 155 && Date.now() < deadline; attempt++){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 15000);
    let resp, data;
    try {
      resp = await fetch(endpoint, {
        method: 'POST', mode: 'same-origin', credentials: 'same-origin', cache: 'no-store',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({failed_url: failedUrl || ''}), signal: controller.signal,
      });
      data = await resp.json();
    } catch {
      throw new Error(uiText('下载链接更新失败，请稍后重试'));
    } finally { clearTimeout(timer); }
    if (!resp.ok) {
      if (resp.status === 401 || resp.status === 403)
        throw new Error(uiText('下载请求已失效，请刷新页面后再试'));
      if (resp.status === 504) throw new Error(uiText('下载链接更新超时，请稍后再试'));
      throw new Error(uiText('暂时无法更新下载链接，请稍后重试'));
    }
    if (resp.status === 200 && data.status === 'ready'){
      const url = videoDirectDownloadURL({source: 'parser', direct_url: data.url});
      if (!url) throw new Error(uiText('暂未获取到可用的下载链接，请稍后重试'));
      // 只更新媒体，保留原来的标题、作者、互动数与文件名。
      video.url = video.direct_url = url;
      video.source = 'parser';
      video.media_available = true;
      // 旧官方备用端点不能与新的主服务地址混用。
      delete video.alt_url;
      delete video.proxy_url;
      delete video.download_url;
      if (video.atc_url) video.atc_url = url;
      for (const key of ['download_refresh_url', 'download_url', 'proxy_url'])
        if (typeof data[key] === 'string') video[key] = data[key];
      return url;
    }
    if (resp.status !== 202 || data.status !== 'processing')
      throw new Error(uiText('下载链接更新失败，请稍后重试'));
    await new Promise(resolve=>setTimeout(resolve,
      Math.max(1000, Math.min(5000, Number(data.retry_after_ms) || 2000))));
  }
  throw new Error(uiText('下载链接更新超时，请稍后再试'));
}

function downloadFallbackURL(url, filename){
  if (!url) return '';
  try {
    const u = new URL(url, location.href);
    if (u.origin !== location.origin || !(
      u.pathname.startsWith('/api/video/') || u.pathname.startsWith('/api/atc/video/') || u.pathname.startsWith('/api/media/video/')
      || u.pathname.startsWith('/api/douyin/video/')))
      return '';
    u.searchParams.set('dl', '1');
    u.searchParams.set('name', filename || 'video.mp4');
    return u.pathname + u.search;
  } catch { return ''; }
}
async function downloadResponseError(resp){
  let message = '';
  try {
    const data = await resp.json();
    message = typeof data.error === 'string' ? data.error : '';
  } catch {}
  if (message) return message;
  if (resp.status === 401 || resp.status === 403)
    return uiText('下载请求未通过验证，请刷新页面后再试');
  if (resp.status === 429)
    return uiText('下载请求过于频繁，请稍后再试');
  return uiText('下载线路暂时不可用（HTTP {status}），请稍后重试', {status: resp.status});
}
async function responseBlobWithProgress(resp, onProgress){
  const type = (resp.headers.get('content-type') || 'application/octet-stream')
    .split(';', 1)[0];
  const total = Number(resp.headers.get('content-length')) || 0;
  if (!resp.body || !resp.body.getReader){
    const blob = await resp.blob();
    onProgress?.(blob.size, total || blob.size);
    return blob;
  }
  const reader = resp.body.getReader();
  const chunks = [];
  let loaded = 0;
  while (true){
    const {done, value} = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.byteLength;
    onProgress?.(loaded, total);
  }
  return new Blob(chunks, {type});
}
function downloadProgress(loaded, total){
  if (total) return uiText('下载中 {percent}%', {percent: Math.min(100, Math.round(loaded / total * 100))});
  return uiText('已下载 {size} MB', {size: (loaded / 1024 / 1024).toFixed(1)});
}
async function fetchAssetBlob(source, onProgress, videoOnly=false){
  const resp = await fetch(source, {
    mode: 'cors', credentials: 'omit', cache: 'no-store',
  });
  if (!resp.ok) throw new Error(await downloadResponseError(resp));
  const contentType = (resp.headers.get('content-type') || '').toLowerCase();
  if (contentType.startsWith('text/') || contentType.includes('json')
      || contentType.includes('html')){
    try { await resp.body?.cancel(); } catch {}
    throw new Error(uiText('下载线路返回了无效内容，请稍后重试'));
  }
  const mediaType=contentType.split(';',1)[0].trim();
  if(videoOnly && (resp.status!==200 || !(mediaType.startsWith('video/') ||
      ['application/mp4','application/octet-stream','binary/octet-stream'].includes(mediaType)))){
    try { await resp.body?.cancel(); } catch {}
    throw new Error(uiText('原片下载返回了无效内容，请重新解析后再试'));
  }
  const blob=await responseBlobWithProgress(resp,onProgress);
  const expected=Number(resp.headers.get('content-length')) || 0;
  if(videoOnly && (!blob.size || (expected && blob.size!==expected)))
    throw new Error(uiText('视频未下载完整，请重试'));
  return blob;
}
async function preflightVideoDownload(source){
  let lastError = null;
  for (let attempt = 0; attempt < 2; attempt++){
    const controller = typeof AbortController === 'function'
      ? new AbortController() : null;
    try {
      const resp = await fetch(source, {
        method: 'GET',
        headers: {'Range': 'bytes=0-0'},
        mode: 'same-origin',
        credentials: 'same-origin',
        cache: 'no-store',
        signal: controller?.signal,
      });
      if (!resp.ok){
        const error = new Error(await downloadResponseError(resp));
        error.retryable = resp.status >= 500;
        error.status = resp.status;
        throw error;
      }
      if (resp.status !== 200 && resp.status !== 206){
        const error = new Error(uiText('下载线路返回了异常状态，请稍后重试'));
        error.retryable = true;
        throw error;
      }
      const contentType = (resp.headers.get('content-type') || '')
        .split(';', 1)[0].trim().toLowerCase();
      if (!(contentType.startsWith('video/')
          || contentType === 'application/mp4'
          || contentType === 'application/octet-stream'
          || contentType === 'binary/octet-stream')){
        const error = new Error(uiText('下载线路返回了无效内容，请稍后重试'));
        error.retryable = true;
        throw error;
      }
      if (resp.status === 206){
        const contentRange = resp.headers.get('content-range') || '';
        const length = Number(resp.headers.get('content-length')) || 0;
        if (!/^bytes 0-0\/(?:\d+|\*)$/i.test(contentRange) || length > 65536){
          const error = new Error(uiText('下载线路未正确响应 Range，请稍后重试'));
          error.retryable = true;
          throw error;
        }
        await resp.arrayBuffer();
      } else {
        try { await resp.body?.cancel(); } catch {}
        controller?.abort();
      }
      return;
    } catch (error) {
      controller?.abort();
      lastError = error;
      if (attempt === 1 || error.retryable === false) break;
      await new Promise(resolve => setTimeout(resolve, 350));
    }
  }
  throw lastError || new Error(uiText('下载失败，请稍后重试'));
}
async function browserDownload(url, filename, btn, fallbackUrl, requireFallback=false, directUrl='', video=null){
  const oldHTML = btn ? btn.innerHTML : null;
  const oldDisabled = btn ? btn.disabled : false;
  if (btn){ btn.textContent = uiText('下载中…'); btn.disabled = true; }
  else toast(uiText('开始下载…'));
  try {
    let fallback = downloadFallbackURL(fallbackUrl, filename);
    let directSaved=false, directError=null;
    const saveDirect = async source => {
      const blob = await fetchAssetBlob(source, (loaded,total)=>{
        if (btn) btn.textContent = downloadProgress(loaded,total);
      }, true);
      const objectURL = URL.createObjectURL(blob);
      clickDownload(objectURL,filename);
      setTimeout(()=>URL.revokeObjectURL(objectURL),60000);
      directSaved = true;
    };
    if (directUrl){
      try { await saveDirect(directUrl); }
      catch { directError = new Error(uiText('原片下载暂时不可用，请重新解析后再试')); }
    }
    if (!directSaved && videoDownloadRefreshURL(video)){
      if (btn) {
        btn.textContent = uiText('正在重新获取下载链接…');
        btn.setAttribute?.('aria-busy','true');
      }
      try {
        const fresh = await refreshVideoDownloadLink(video, directUrl);
        fallback = downloadFallbackURL(video.download_url || video.proxy_url || fallbackUrl, filename);
        try { await saveDirect(fresh); }
        catch { throw new Error(uiText('下载链接更新后仍不可用，请稍后重试')); }
      } catch(error) {
        directError = error;
      }
    }
    if (!directSaved && requireFallback && !fallback)
      throw directError || new Error(uiText('暂未获取到可用的下载线路，请重新解析后再试'));
    if (!directSaved && directError && !fallback) throw directError;
    if (!directSaved && fallback){
      if (btn) btn.textContent = uiText('尝试备用下载线路…');
      try { await preflightVideoDownload(fallback); }
      catch(error){
        // 鉴权、限频和下架错误比前面的一次源站失败更可操作，不能被覆盖。
        throw [401,403,404,410,429,451].includes(error.status) ? error : (directError || error);
      }
      clickDownload(fallback, filename, true, directError ? ()=>toast(directError.message) : toast);
    } else if (!directSaved) {
      const blob = await fetchAssetBlob(url, (loaded, total) => {
        if (btn) btn.textContent = downloadProgress(loaded, total);
      });
      const u = URL.createObjectURL(blob);
      clickDownload(u, filename);
      setTimeout(()=>URL.revokeObjectURL(u), 5000);
    }
    toast(uiText('下载已开始，请查看浏览器下载列表'));
    return true;
  } catch (error) {
    toast(error && error.message ? error.message : uiText('下载失败，请稍后重试'));
    return false;
  } finally {
    if (btn){ btn.innerHTML = oldHTML; btn.disabled = oldDisabled; btn.removeAttribute?.('aria-busy'); }
  }
}
function imgFail(image){
  // 同源图片端点在服务端已刷新过一次；失败时保留
  // 当前页面和其他已加载图片，避免整页无限重载。
  if (image){ image.onerror = null; image.classList.add('is-failed'); image.alt = uiText('图片暂时加载失败'); }
  if (window._imgFailed) return; window._imgFailed = true;
  toast(uiText('部分图片暂时无法加载，请稍后刷新再试'));
}

/* ---------------- 分享海报（前端 canvas 合成，服务器不参与、不落地） ----------------
   微信对链接的拦截远多于图片，海报是链接被封时最重要的传播兜底。
   封面来自抖音 CDN（返回 Access-Control-Allow-Origin: *），可跨域绘制；
   二维码用同源 PNG（SVG 在部分内核会污染画布，导致 toBlob 抛 SecurityError）。 */
function loadImg(src, cross){
  return new Promise((res, rej) => {
    const i = new Image();
    if (cross) i.crossOrigin = 'anonymous';
    i.onload = () => res(i); i.onerror = rej;
    i.src = src;
  });
}
function wrapText(ctx, text, maxW, maxLines){
  const lines = []; let cur = '';
  for (const ch of String(text)){
    if (ctx.measureText(cur + ch).width > maxW){ lines.push(cur); cur = ch;
      if (lines.length === maxLines){ lines[maxLines-1] = lines[maxLines-1].slice(0,-1) + '…'; return lines; }
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

let _posterURL = null;
async function makePoster(){
  document.getElementById('pload').classList.add('show');
  try {
    const W = 750, H = 1180, P = 44;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');

    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#191d24'); g.addColorStop(1, '#0d0f13');
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    // 封面：等比裁切填满 750×560
    const CH = 560;
    let cover = null;
    try { const cu = S.card_cover || S.cover; if (cu) cover = await loadImg(cu, true); } catch {}
    if (cover){
      const r = Math.max(W / cover.width, CH / cover.height);
      const w = cover.width * r, h = cover.height * r;
      x.save(); x.beginPath(); x.rect(0, 0, W, CH); x.clip();
      x.drawImage(cover, (W - w) / 2, (CH - h) / 2, w, h);
      const fade = x.createLinearGradient(0, CH - 200, 0, CH);
      fade.addColorStop(0, 'rgba(13,15,19,0)'); fade.addColorStop(1, 'rgba(13,15,19,1)');
      x.fillStyle = fade; x.fillRect(0, CH - 200, W, 200);
      x.restore();
    } else {
      x.fillStyle = '#22262e'; x.fillRect(0, 0, W, CH);
      x.fillStyle = '#5B6470'; x.font = '600 30px sans-serif'; x.textAlign = 'center';
      x.fillText(uiText('抖音作品'), W/2, CH/2); x.textAlign = 'left';
    }

    // 播放角标
    x.fillStyle = 'rgba(254,44,85,.94)';
    x.beginPath(); x.arc(W/2, CH/2 - 40, 54, 0, Math.PI*2); x.fill();
    x.fillStyle = '#fff'; x.beginPath();
    x.moveTo(W/2 - 17, CH/2 - 68); x.lineTo(W/2 + 26, CH/2 - 40); x.lineTo(W/2 - 17, CH/2 - 12);
    x.closePath(); x.fill();

    // 标题
    let y = CH + 62;
    x.fillStyle = '#EDEFF2'; x.font = '650 36px "PingFang SC",system-ui,sans-serif';
    for (const line of wrapText(x, S.title, W - P*2, 3)){ x.fillText(line, P, y); y += 50; }

    // 作者
    y += 14;
    try {
      if (S.avatar){
        const av = await loadImg(S.avatar, true);
        x.save(); x.beginPath(); x.arc(P + 27, y - 8, 27, 0, Math.PI*2); x.clip();
        x.drawImage(av, P, y - 35, 54, 54); x.restore();
      }
    } catch {}
    x.fillStyle = '#B9C0CA'; x.font = '400 27px "PingFang SC",system-ui,sans-serif';
    x.fillText('@' + (S.author || uiText('视频创作者')), P + (S.avatar ? 70 : 0), y);

    // 二维码 + 引导
    const qr = await loadImg('/s/' + S.sid + '/qr.png', false);
    const QS = 190, qy = H - QS - 92;
    x.fillStyle = '#fff'; x.fillRect(P - 8, qy - 8, QS + 16, QS + 16);
    x.drawImage(qr, P, qy, QS, QS);
    x.fillStyle = '#EDEFF2'; x.font = '600 30px "PingFang SC",system-ui,sans-serif';
    x.fillText(uiText('扫码直接观看'), P + QS + 34, qy + 62);
    x.fillStyle = '#8A93A0'; x.font = '400 24px "PingFang SC",system-ui,sans-serif';
    x.fillText(uiText('无水印原片 · 无需登录抖音'), P + QS + 34, qy + 104);
    x.fillText(uiText('不用装抖音 App'), P + QS + 34, qy + 140);

    // 品牌页脚（带域名：海报进朋友圈后是免费获客位）
    x.fillStyle = '#4E5561'; x.font = '400 21px "PingFang SC",system-ui,sans-serif';
    x.fillText(uiText('抖音无水印下载器 · 不保存媒体文件 · ') + location.host, P, H - 42);

    // 关键：必须用 data: URI 而非 blob: 对象 URL —— 微信 WebView 无法对 blob: 图片
    // 长按「保存图片/发送给朋友」，只认 data: 与 http(s)。用 blob 会导致海报存不下也发不出。
    const dataURL = c.toDataURL('image/png');
    _posterURL = dataURL;
    const img = document.getElementById('posterImg');
    img.src = dataURL;
    const dl = document.getElementById('posterDl');
    dl.href = dataURL;
    dl.style.display = IS_WECHAT_UA ? 'none' : '';       // 微信内无法触发下载，靠长按保存
    document.getElementById('posterTip').textContent = IS_WECHAT_UA
      ? uiText('长按上方图片 → 保存图片 / 发送给朋友')
      : uiText('右键/长按保存图片，或点下载海报');
    document.getElementById('pmask').classList.add('show');
    track('cta');
  } catch(e){
    toast(uiText('海报生成失败：') + (e && e.message ? e.message : uiText('图片跨域受限')));
  } finally {
    document.getElementById('pload').classList.remove('show');
  }
}
function hidePoster(){ document.getElementById('pmask').classList.remove('show'); }

/* ---------------- 微信分享卡片（JS-SDK，未配置公众号时静默跳过） ---------------- */
async function setupWxShare(){
  if (!IS_WECHAT_UA || !S.sid) return;
  let cfg;
  try {
    const url = location.href.split('#')[0];
    cfg = await (await fetch('/api/wx/jssdk?url=' + encodeURIComponent(url))).json();
  } catch { return; }
  if (!cfg || !cfg.enabled) return;                     // 没配公众号 → 用微信默认抓取的卡片
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://res.wx.qq.com/open/js/jweixin-1.6.0.js';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  }).catch(() => {});
  if (!window.wx) return;
  wx.config({debug:false, appId:cfg.appId, timestamp:cfg.timestamp, nonceStr:cfg.nonceStr,
    signature:cfg.signature, jsApiList:['updateAppMessageShareData','updateTimelineShareData']});
  wx.ready(() => {
    const opt = {
      title: (S.title || uiText('抖音作品')).slice(0, 40),        // 标题=抖音文案，与卡片抓取一致
      desc: shareText(),
      link: S.url || location.href,
      imgUrl: S.card_cover || S.cover || (ORIGIN + '/og.png'),   // 无签名 JPEG 优先；微信不渲染 SVG
    };
    wx.updateAppMessageShareData(opt);
    wx.updateTimelineShareData({title: opt.title, link: opt.link, imgUrl: opt.imgUrl});
  });
}

/* ---------------- 投诉 ---------------- */
function report(){
  const reason = prompt(uiText('请简要说明投诉理由（如：我是该作品的著作权人，要求下架）'));
  if (!reason) return;
  const contact = prompt(uiText('留下联系方式（选填，仅用于回复投诉；保留期最多 30 天，到期后定时删除）')) || '';
  fetch('/api/report', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({sid: S.sid, reason, contact})})
    .then(r=>r.json()).then(d=>toast(d.message || uiText('已收到投诉'))).catch(()=>toast(uiText('提交失败，请稍后再试')));
}

/* ---------------- 入口 ---------------- */
if (!S || !S.state || S.state !== 'ok') {
  renderState(S && S.state);
  if (S && (S.state === 'pending' || S.state === 'processing'))
    scheduleStatusPoll(nextStatusPollDelay(S.poll_after_ms, 0));
} else {
  render(); setupWxShare(); prepareShareMedia();

}
